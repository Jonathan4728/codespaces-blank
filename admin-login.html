<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login | Flores Small Engine Repair</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top,
          rgba(223, 31, 38, 0.15),
          transparent 35%
        ),
        #050505;

      color: white;

      font-family: Arial, Helvetica, sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      padding: 35px;

      background: #111;

      border: 1px solid #333;
      border-top: 4px solid #df1f26;
      border-radius: 10px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .logo {
      display: block;

      width: 150px;
      max-height: 120px;

      margin: 0 auto 20px;

      object-fit: contain;
    }

    h1 {
      margin: 0;

      text-align: center;

      font-size: 28px;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 8px 0 28px;

      color: #aaa;

      text-align: center;

      font-size: 14px;
    }

    label {
      display: block;

      margin-bottom: 18px;

      color: #ddd;

      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;

      margin-top: 7px;
      padding: 14px;

      border: 1px solid #444;
      border-radius: 5px;

      background: #080808;

      color: white;

      font-size: 16px;
    }

    input:focus {
      outline: none;

      border-color: #df1f26;

      box-shadow:
        0 0 0 3px rgba(223, 31, 38, 0.15);
    }

    button {
      width: 100%;

      padding: 15px;

      border: 0;
      border-radius: 5px;

      background: #df1f26;

      color: white;

      font-size: 16px;
      font-weight: bold;

      text-transform: uppercase;

      cursor: pointer;
    }

    button:hover {
      background: #b9151b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 20px;

      margin: 18px 0 0;

      text-align: center;

      font-size: 14px;
    }

    .error {
      color: #ff6868;
    }

    .success {
      color: #6de58b;
    }

    .back-home {
      display: block;

      margin-top: 22px;

      color: #aaa;

      text-align: center;
      text-decoration: none;

      font-size: 13px;
    }

    .back-home:hover {
      color: white;
    }
  </style>
</head>


<body>

  <div class="login-container">

    <div class="login-card">

      <img
        src="logo.png"
        alt="Flores Small Engine Repair"
        class="logo"
      >

      <h1>Admin Login</h1>

      <p class="subtitle">
        Flores Small Engine Repair Management
      </p>


      <form id="loginForm">

        <label>
          Email

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >
        </label>


        <label>
          Password

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>


        <button
          id="loginButton"
          type="submit"
        >
          Sign In
        </button>

      </form>


      <p id="message"></p>


      <a
        href="index.html"
        class="back-home"
      >
        ← Back to Flores Small Engine Repair
      </a>

    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://ykqbjqiujnqljwwyxrre.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_CmCfIvZJJwMNV0QzQwrEsw_W0X8XOvj";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    /* =====================================
       CHECK IF ALREADY LOGGED IN
    ===================================== */

    async function checkExistingLogin() {

      const {
        data: { session }
      } =
        await supabaseClient.auth.getSession();


      if (session) {
        window.location.href = "admin.html";
      }

    }


    checkExistingLogin();


    /* =====================================
       LOGIN
    ===================================== */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        message.textContent = "";

        message.className = "";


        loginButton.disabled = true;

        loginButton.textContent =
          "Signing In...";


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          message.textContent =
            error.message;

          message.className =
            "error";


          loginButton.disabled = false;

          loginButton.textContent =
            "Sign In";

          return;
        }


        if (data.session) {

          message.textContent =
            "Login successful.";

          message.className =
            "success";


          window.location.href =
            "admin.html";

        }

      }
    );

  </script>

</body>
</html>
